name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent_job:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issue_comment' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: PR Agent action step
      # pinned to main as of 2026-10-21; update deliberately via PR
      uses: the-pr-agent/pr-agent@a3bdec38cdb98736ab1f8be067c507bbdce954bc
      env:
        CONFIG__MODEL: "openrouter/minimax/minimax-m3.1-flash:free"
        CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"
        OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
