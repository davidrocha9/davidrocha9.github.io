name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: PR Agent action step
      uses: the-pr-agent/pr-agent@main
      env:
        PR_AGENT_CONFIG_BRANCH: ${{ github.head_ref }}
        CONFIG__MODEL: "openrouter/minimax/minimax-m3.1-flash:free"
        CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"
        OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
